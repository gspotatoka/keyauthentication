<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>License admin</title>
<style>
:root{--bg:#0e1218;--card:#1a212b;--b:#2a3441;--t:#e6edf3;--m:#8b98a8;--a:#3b82f6;--bad:#da3633;--good:#2ea043}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif;padding:20px;max-width:1100px}
.card{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:16px;margin-bottom:16px}
h1{font-size:20px}h2{font-size:15px;margin:0 0 10px}
input{background:#0f141b;border:1px solid var(--b);color:var(--t);padding:8px;border-radius:6px}
button{background:var(--a);color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
button.s{background:#252e3b;padding:4px 8px;font-size:12px}button.d{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:4px;color:var(--m);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--b);font-size:13px}
code{font-family:Consolas,monospace}.ok{color:var(--good)}.bad{color:var(--bad)}.wrap{overflow-x:auto}
pre{background:#0f141b;padding:10px;border-radius:6px;user-select:all}
</style></head><body>
<h1>License admin</h1>
<div class="card"><div class="row">
 <label>Admin token<input id="tok" type="password" size="36"></label>
 <button id="login">Load</button></div></div>

<div class="card"><h2>Create keys</h2><div class="row">
 <label>Count<input id="count" type="number" value="1" min="1" max="100" style="width:70px"></label>
 <label>Days (0 = lifetime)<input id="days" type="number" value="30" min="0" style="width:120px"></label>
 <label>Max devices<input id="dev" type="number" value="1" min="1" style="width:90px"></label>
 <label>Note / customer<input id="note" size="26"></label>
 <button id="create">Generate</button></div>
 <pre id="out" hidden></pre></div>

<div class="card"><h2>Licenses</h2><div class="wrap"><table id="tbl"></table></div></div>

<script>
const $=id=>document.getElementById(id);
$('tok').value=sessionStorage.getItem('tok')||'';
async function api(body){
  const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('tok').value},body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status); return j;
}
const fmt=ms=>ms?new Date(ms).toLocaleString():'—';
async function load(){
  try{
    sessionStorage.setItem('tok',$('tok').value);
    const {licenses}=await api({action:'list'});
    const t=$('tbl'); t.innerHTML='<tr><th>Key</th><th>Note</th><th>Status</th><th>Expires</th><th>Devices</th><th>Last seen</th><th></th></tr>';
    for(const l of licenses){
      const exp=l.exp&&Date.now()>l.exp, st=l.revoked?'revoked':exp?'expired':l.exp?'active':l.days?'unused':'lifetime';
      const tr=document.createElement('tr');
      const expTxt=l.days?(l.exp?fmt(l.exp):l.days+'d on first use'):'never';
      tr.innerHTML=`<td><code>${l.key}</code></td><td></td><td class="${l.revoked||exp?'bad':'ok'}">${st}</td><td>${expTxt}</td><td>${(l.devices||[]).length}/${l.maxDevices}</td><td>${fmt(l.lastSeen)}</td><td></td>`;
      tr.children[1].textContent=l.note||'';
      const td=tr.lastChild;
      const btn=(txt,act,cls)=>{const b=document.createElement('button');b.textContent=txt;b.className='s '+(cls||'');
        b.onclick=async()=>{if(act==='delete'&&!confirm('Delete '+l.key+'?'))return;await api({action:act,id:l.id});load()};td.append(b,' ')};
      btn(l.revoked?'Unrevoke':'Revoke',l.revoked?'unrevoke':'revoke');
      btn('Reset devices','reset_devices'); btn('Delete','delete','d');
      t.append(tr);
    }
  }catch(e){alert('Error: '+e.message)}
}
$('login').onclick=load;
$('create').onclick=async()=>{
  try{
    const {keys}=await api({action:'create',count:$('count').value,days:$('days').value,maxDevices:$('dev').value,note:$('note').value});
    $('out').hidden=false;$('out').textContent=keys.join('\n');load();
  }catch(e){alert('Error: '+e.message)}
};
if($('tok').value)load();
</script></body></html>
